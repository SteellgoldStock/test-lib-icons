<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Pixel Icon Preview</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background: #0a0a0a;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 20px 24px;

      background: rgba(10, 10, 10, 0.94);
      border-bottom: 1px solid #242424;

      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0;

      font-size: 18px;
      font-weight: 600;
    }

    .count {
      color: #777;
      font-size: 13px;
    }

    .grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(150px, 1fr)
        );

      gap: 12px;

      padding: 24px;
    }

    figure {
      overflow: hidden;

      margin: 0;

      background: #111;
      border: 1px solid #242424;
      border-radius: 8px;
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 140px;

      color: #fff;
      background: #080808;
    }

    .icon svg {
      width: 64px;
      height: 64px;

      image-rendering: pixelated;
    }

    figcaption {
      overflow: hidden;

      padding: 10px 12px;

      color: #aaa;
      border-top: 1px solid #242424;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 12px;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      padding: 80px 24px;

      color: #666;
      text-align: center;
    }
  </style>
</head>
