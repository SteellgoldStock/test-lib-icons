<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
    <title>Pixel Icon Preview (16x16 · vector-square)</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --icon-size: 32px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: rgba(10, 10, 10, 0.94);
      border-bottom: 1px solid #242424;
      backdrop-filter: blur(12px);
    }

    .title {
      min-width: max-content;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .source {
      margin-top: 3px;
      color: #666;
      font-size: 11px;
    }

    .controls {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      max-width: 680px;
      margin-left: auto;
    }

    input,
    select {
      height: 36px;
      color: #fff;
      background: #111;
      border: 1px solid #2b2b2b;
      border-radius: 6px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #555;
    }

    input {
      flex: 1;
      min-width: 140px;
      padding: 0 12px;
    }

    select {
      padding: 0 10px;
      cursor: pointer;
    }

    .fill-mode {
      min-width: 118px;
    }

    .count {
      min-width: max-content;
      color: #777;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 24px;
    }

    figure {
      overflow: hidden;
      margin: 0;
      background: #111;
      border: 1px solid #242424;
      border-radius: 8px;
    }

    figure[hidden] {
      display: none;
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 120px;
      color: #fff;
      background: #080808;
    }

    .icon svg {
      width: var(--icon-size);
      height: var(--icon-size);
      image-rendering: pixelated;
    }

    figcaption {
      overflow: hidden;
      padding: 10px 12px;
      color: #aaa;
      border-top: 1px solid #242424;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      padding: 80px 24px;
      color: #666;
      text-align: center;
    }

    @media (max-width: 720px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .controls {
        width: 100%;
        max-width: none;
        margin-left: 0;
      }

      .count {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="title">
      <h1>Pixel Icon Preview</h1>
      <div class="source">16x16 · vector-square</div>
    </div>

    

    <span class="count" id="count">
      0 icons
    </span>
  </header>

  
        <div class="empty">
          No SVG files found in 16x16 · vector-square/
        </div>
      

  <script>
    const search = document.querySelector("#search");
    const size = document.querySelector("#size");
    const fillMode = document.querySelector("#fillMode");
    const count = document.querySelector("#count");
    const cards = Array.from(
      document.querySelectorAll("figure[data-icon-name]"),
    );
    const iconSvgs: Array<{ svg: SVGElement; defaultFill: string | null }> =
      [];

    for (const card of cards) {
      const svg = card.querySelector("svg");

      if (!(svg instanceof SVGElement)) {
        continue;
      }

      iconSvgs.push({
        svg,
        defaultFill: svg.getAttribute("fill"),
      });
    }

    const applyFillMode = () => {
      const isFilled = fillMode?.value === "filled";

      for (const icon of iconSvgs) {
        if (icon.defaultFill === null) {
          if (isFilled) {
            icon.svg.setAttribute("fill", "currentColor");
          } else {
            icon.svg.removeAttribute("fill");
          }
          continue;
        }

        icon.svg.setAttribute(
          "fill",
          isFilled ? "currentColor" : icon.defaultFill,
        );
      }
    };

    const updateSearch = () => {
      const query = (search?.value ?? "")
        .trim()
        .toLowerCase();

      let visible = 0;

      for (const card of cards) {
        const name = card.dataset.iconName ?? "";
        const matches = name.includes(query);

        card.hidden = !matches;

        if (matches) {
          visible += 1;
        }
      }

      if (count) {
        count.textContent =
          query.length > 0
            ? `${visible} / ${cards.length} icons`
            : `${cards.length} icon${cards.length === 1 ? "" : "s"}`;
      }
    };

    search?.addEventListener("input", updateSearch);

    size?.addEventListener(
      "change",
      () => {
        document.documentElement.style.setProperty(
          "--icon-size",
          `${size.value}px`,
        );
      },
    );

    fillMode?.addEventListener("change", applyFillMode);
    applyFillMode();
  </script>
</body>
</html>
